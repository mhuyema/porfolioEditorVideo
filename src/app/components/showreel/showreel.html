<section class="py-24 px-margin-mobile md:px-margin-desktop relative">
  <div class="max-w-container-max mx-auto">
    <div class="flex items-center gap-4 mb-12">
      <span class="text-xs font-semibold text-primary tracking-widest uppercase">Showreel</span>
      <div class="h-px flex-1 bg-white/10"></div>
    </div>

    <div class="relative aspect-video rounded-3xl overflow-hidden glass-card shadow-[0_0_100px_rgba(184,196,255,0.1)] group cursor-pointer"
         (mouseenter)="miShowreel.play()"
         (mouseleave)="pausarYReiniciar(miShowreel)">
      
      <div class="absolute inset-0 bg-black/40 flex items-center justify-center z-10 transition-opacity duration-300 group-hover:opacity-0 pointer-events-none">
        <button class="w-24 h-24 rounded-full bg-primary/10 border border-primary/30 backdrop-blur-md flex items-center justify-center hover:scale-110 active:scale-90 transition-transform">
          <span class="material-symbols-outlined text-4xl text-white">play_circle</span>
        </button>
      </div>

      <div class="absolute bottom-8 left-8 z-20 glass-card px-6 py-4 rounded-2xl max-w-xs pointer-events-none transition-transform duration-300 group-hover:translate-y-1">
        <h3 class="text-xl font-bold text-white mb-2">2026 Creative Reel</h3>
        <p class="text-xs text-white/60">Short-form mastery, kinetic motion, and spatial sound design.</p>
      </div>

      <video #miShowreel
             src="assets/presentacionLanding.mp4" 
             loop
             muted
             playsinline
             preload="metadata"
             class="absolute inset-0 w-full h-full object-cover opacity-70 group-hover:opacity-100 group-hover:scale-102 transition-all duration-700 pointer-events-none">
      </video>

    </div>
  </div>
</section>
