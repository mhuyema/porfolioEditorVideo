<section fadeIn class="py-24 px-margin-mobile md:px-margin-desktop bg-background" id="services">
  <div class="max-w-container-max mx-auto">

    <div class="flex items-center gap-4 mb-4">
      <span class="text-xs font-semibold text-primary tracking-widest uppercase font-manrope">{{ lang.t().services.label }}</span>
      <div class="h-px flex-1 bg-white/10"></div>
    </div>

    <div class="mb-12">
      <h2 class="font-bricolage text-4xl md:text-6xl font-extrabold mb-4 text-on-surface tracking-tight">
        {{ lang.t().services.title }}
      </h2>
      <p class="font-manrope text-lg text-on-surface-variant max-w-xl">
        {{ lang.t().services.description }}
      </p>
    </div>

    <div class="grid md:grid-cols-3 gap-6">
      @for (item of lang.t().services.items; track item.title; let i = $index) {
        <div class="service-card glass-card rounded-3xl p-8 flex flex-col gap-6 border border-white/[0.06] hover:border-primary/25 transition-all duration-300 hover:-translate-y-2 hover:shadow-[0_28px_56px_rgba(0,0,0,0.65)]"
             [style.transition-delay]="i * 60 + 'ms'">

          <div class="w-12 h-12 rounded-2xl bg-primary/10 border border-primary/20 flex items-center justify-center">
            <span class="material-symbols-outlined text-2xl text-primary">{{ item.icon }}</span>
          </div>

          <div>
            <h3 class="font-bricolage text-xl font-bold text-on-surface mb-2 tracking-tight">{{ item.title }}</h3>
            <p class="font-manrope text-sm text-on-surface-variant leading-relaxed">{{ item.description }}</p>
          </div>

          <div class="flex flex-wrap gap-2 mt-auto pt-2 border-t border-white/5">
            @for (tag of item.tags; track tag) {
              <span class="text-[10px] font-manrope font-semibold tracking-widest uppercase px-3 py-1 rounded-full bg-white/5 border border-white/8 text-on-surface-variant/60">
                {{ tag }}
              </span>
            }
          </div>

        </div>
      }
    </div>

  </div>
</section>
