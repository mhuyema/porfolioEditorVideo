<section class="relative min-h-screen flex flex-col items-center justify-center pt-32 px-margin-mobile md:px-margin-desktop overflow-hidden">
  <div class="absolute inset-0 light-leak -z-10 pointer-events-none opacity-50"></div>
  
  <div class="text-center z-10 w-full max-w-6xl">
    <h1 class="text-5xl md:text-8xl font-extrabold text-white tracking-tighter mb-4 animate-pulse">
      PORTFOLIO 
    </h1>
    <p class="text-lg md:text-xl text-purple-200/80 max-w-2xl mx-auto mb-12 opacity-80">
      Precision short-form editing for the next generation of visual storytellers. Ultra-modern pacing meets high-fidelity production.
    </p>
  </div>

  <div class="relative w-full max-w-md aspect-[4/3] folder-depth mt-8 group cursor-pointer">
    
    <img src="assets/ae-icon.png" alt="After Effects" class="absolute top-4 left-12 w-16 h-16 object-contain -z-10 opacity-0 scale-75 rotate-0 translate-x-0 translate-y-0 transition-all duration-500 ease-out group-hover:opacity-100 group-hover:scale-100 group-hover:-translate-x-20 group-hover:-translate-y-20 group-hover:-rotate-12 filter drop-shadow-[0_0_15px_rgba(154,106,255,0.4)]" />
    <img src="assets/pr-icon.png" alt="Premiere Pro" class="absolute top-4 left-1/2 -translate-x-1/2 w-16 h-16 object-contain -z-10 opacity-0 scale-75 rotate-0 translate-y-0 transition-all duration-500 ease-out delay-75 group-hover:opacity-100 group-hover:scale-100 group-hover:-translate-y-24 group-hover:rotate-6 filter drop-shadow-[0_0_15px_rgba(20,220,160,0.4)]" />
    <img src="assets/ps-icon.png" alt="Photoshop" class="absolute top-4 right-12 w-16 h-16 object-contain -z-10 opacity-0 scale-75 rotate-0 translate-x-0 translate-y-0 transition-all duration-500 ease-out delay-150 group-hover:opacity-100 group-hover:scale-100 group-hover:translate-x-20 group-hover:-translate-y-20 group-hover:rotate-12 filter drop-shadow-[0_0_15px_rgba(40,170,255,0.4)]" />

    <div class="absolute inset-0 bg-purple-950/40 backdrop-blur-md rounded-[2rem] border-[0.5px] border-purple-500/30 transform rotate-x-6 rotate-y--12 shadow-2xl transition-transform duration-700 group-hover:rotate-x-0 group-hover:rotate-y-0">
      
      <div class="absolute top-0 left-8 -translate-y-full w-24 h-8 bg-purple-950/40 backdrop-blur-md rounded-t-xl border-t border-x border-purple-500/30"></div>

      <div class="absolute -top-4 -right-8 w-32 h-32 glass-card rounded-2xl rotate-12 flex items-center justify-center p-4 shadow-inner">
        <span class="material-symbols-outlined text-purple-400 scale-150">play_arrow</span>
        <div class="absolute inset-0 bg-gradient-to-tr from-transparent via-white/10 to-transparent pointer-events-none"></div>
      </div>

      <div class="p-8 flex flex-col h-full justify-between">
        <div class="space-y-4">
          <div class="h-2 w-32 bg-purple-500/40 rounded-full"></div>
          <div class="h-2 w-48 bg-purple-300/10 rounded-full"></div>
        </div>
        
        <div class="w-full h-48 bg-purple-900/20 rounded-xl flex items-center justify-center border border-purple-500/20 overflow-hidden"
             (mouseenter)="miVideo.play()"
             (mouseleave)="miVideo.pause()">
          <video 
            #miVideo
            src="assets/presentacionLanding.mp4" 
            muted 
            loop
            playsinline 
            class="w-full h-full object-cover transition-all duration-300 opacity-60 filter grayscale hover:opacity-100 hover:filter-none">
          </video>
        </div>
      </div>

    </div>
  </div>
</section>
