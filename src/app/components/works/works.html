<section class="py-24 px-margin-mobile md:px-margin-desktop bg-background overflow-hidden" id="work">
  <div class="max-w-container-max mx-auto relative group/section">
    
    <div class="mb-12">
      <h2 class="font-bricolage text-4xl md:text-6xl font-extrabold mb-4 text-on-surface tracking-tight">
        SELECTED WORKS
      </h2>
      <p class="font-manrope text-lg text-on-surface-variant max-w-xl">
        Curated vertical content engineered for retention and engagement.
      </p>
    </div>

    <button (click)="anteriorVideo()" 
            class="absolute left-4 top-[65%] -translate-y-1/2 z-30 w-14 h-14 rounded-full bg-black/20 backdrop-blur-md border border-white/10 text-white flex items-center justify-center opacity-0 group-hover/section:opacity-100 transition-all duration-300 hover:bg-white hover:text-black hover:scale-110 active:scale-95 font-sans text-xl shadow-[0_4px_30px_rgba(0,0,0,0.4)]">
      ←
    </button>
    
    <button (click)="siguienteVideo()" 
            class="absolute right-4 top-[65%] -translate-y-1/2 z-30 w-14 h-14 rounded-full bg-black/20 backdrop-blur-md border border-white/10 text-white flex items-center justify-center opacity-0 group-hover/section:opacity-100 transition-all duration-300 hover:bg-white hover:text-black hover:scale-110 active:scale-95 font-sans text-xl shadow-[0_4px_30px_rgba(0,0,0,0.4)]">
      →
    </button>

    <div #carruselContenedor 
         class="flex gap-8 overflow-x-auto pb-8 pt-4 snap-x snap-mandatory scroll-smooth [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
      
      @for (video of misVideos; track video.titulo) {
        
        <div class="group relative overflow-hidden rounded-3xl glass-card bg-neutral-900 flex items-end p-6 w-[260px] md:w-[calc((100%-6rem)/4)] aspect-[9/16] shrink-0 snap-start shadow-lg transition-all duration-500 hover:-translate-y-2 hover:shadow-[0_20px_40px_rgba(0,0,0,0.6)]"
             [class.cursor-pointer]="video.linkExterno"
             [class.cursor-default]="!video.linkExterno"
             (mouseenter)="targetVideo.play()"
             (mouseleave)="pausarYReiniciar(targetVideo)"
             (click)="video.linkExterno ? abrirVideo(video.linkExterno) : null">
          
          <video #targetVideo
                 [src]="video.linkVideo"
                 loop
                 muted
                 playsinline
                 preload="metadata"
                 class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 pointer-events-none">
          </video>
          
      
          @if (video.linkExterno) {
            <div class="absolute top-5 right-5 z-20 px-3 py-1.5 rounded-xl bg-white/10 backdrop-blur-md border border-white/20 text-white font-manrope text-[11px] font-semibold tracking-wider opacity-0 group-hover:opacity-100 transition-all duration-300 group-hover:bg-primary group-hover:text-black flex items-center gap-1 shadow-md">
              <span>Ver en RRSS</span>
              <span class="text-[9px]">↗</span>
            </div>
          }

          <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/30 to-transparent z-10 pointer-events-none"></div>
          
          <div class="relative z-20 pointer-events-none">
            <span [className]="'text-[10px] font-manrope font-bold mb-1 block tracking-widest uppercase opacity-80 ' + video.colorBadge">
              {{ video.categoria }}
            </span>
            <h4 class="font-bricolage text-lg md:text-xl font-bold text-white tracking-tight">
              {{ video.titulo }}
            </h4>
          </div>

        </div>

      }

    </div>
  </div>
</section>
